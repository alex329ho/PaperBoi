name: Backend Test

on:
  push:
    paths:
      - "backend/**"
      - "Dockerfile"
      - "docker-compose.yml"
      - "pytest.ini"
  pull_request:
    paths:
      - "backend/**"
      - "Dockerfile"
      - "docker-compose.yml"
      - "pytest.ini"

jobs:
  lint-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pylint black pytest-cov

      - name: Lint (black)
        run: black --check backend

      - name: Lint (pylint)
        run: pylint backend --ignore=venv

      - name: Unit tests with coverage
        env:
          PYTHONPATH: backend
        run: pytest --cov=backend --cov-report=xml --cov-report=term

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: coverage.xml
