version: "3.9"

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: paperboi_api
    env_file:
      - backend/.env.example
    ports:
      - "8000:8000"
    depends_on:
      - db
      - cache
    volumes:
      - ./backend:/app
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]

  db:
    image: postgres:16-alpine
    container_name: paperboi_db
    environment:
      POSTGRES_USER: paperboi
      POSTGRES_PASSWORD: paperboi
      POSTGRES_DB: paperboi
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/db/init_db.sql:/docker-entrypoint-initdb.d/init_db.sql:ro

  cache:
    image: redis:7-alpine
    container_name: paperboi_cache
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]

volumes:
  postgres_data:
